[dotfiles.vscode-keybindings]
source = "profiles/global/keybindings.jsonc"
mode = "symlink"
variants = [
  { os = "windows", target = "~/AppData/Roaming/Code/User/keybindings.json" },
  { os = "linux", target = "~/.config/Code/User/keybindings.json" },
]

[dotfiles.vscode-settings]
source = "profiles/global/settings.jsonc"
mode = "symlink"
variants = [
  { os = "windows", target = "~/AppData/Roaming/Code/User/settings.json" },
  { os = "linux", target = "~/.config/Code/User/settings.json" },
]

[dotfiles.vscode-tasks]
source = "profiles/global/tasks.jsonc"
mode = "symlink"
variants = [
  { os = "windows", target = "~/AppData/Roaming/Code/User/tasks.json" },
  { os = "linux", target = "~/.config/Code/User/tasks.json" },
]

[dotfiles.vscode-snippets]
source = "profiles/global/snippets/*"
mode = "symlink"
variants = [
  { os = "windows", target = "~/AppData/Roaming/Code/User/snippets/*" },
  { os = "linux", target = "~/.config/Code/User/snippets/*" },
]

[dotfiles.vscode-scripts]
source = "scripts/*"
mode = "symlink"
variants = [
  { default = true, target = "~/.local/bin/*" },
]

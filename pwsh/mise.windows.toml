[dotfiles]
"~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" = { source = "profile.ps1", mode = "symlink" }
"~/Documents/PowerShell/Modules/ScriptRunner" = { source = "modules/ScriptRunner", mode = "symlink" }
"~/Documents/PowerShell/integrations" = { source = "integrations", mode = "symlink" }

[dotfile_groups.pwsh-scripts]
root = "pwsh/scripts"
target = "~/.local/bin"
mode = "symlink-each"

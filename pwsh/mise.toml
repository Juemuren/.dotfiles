[dotfiles.pwsh-scripts]
source = "scripts"
mode = "symlink-each"
variants = [
  { default = true, target = "~/.local/bin" },
]

[dotfiles.pwsh-profile]
source = "profile.ps1"
mode = "symlink"
variants = [
  { os = "windows", target = "~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" },
]

[dotfiles.pwsh-modules]
source = "modules"
mode = "symlink-each"
variants = [
  { os = "windows", target = "~/Documents/PowerShell/Modules" },
]

[dotfiles.pwsh-integrations]
source = "integrations"
mode = "symlink-each"
variants = [
  { os = "windows", target = "~/Documents/PowerShell/integrations" },
]

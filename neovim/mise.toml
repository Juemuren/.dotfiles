[dotfiles.neovim]
source = "nvim"
mode = "symlink"
variants = [
  { os = "windows", target = "~/AppData/Local/nvim" },
  { os = "linux", target = "~/.config/nvim" },
]

[dotfiles.vscode-neovim]
source = "vscode-neovim"
mode = "symlink"
variants = [
  { os = "windows", target = "~/AppData/Local/vscode-neovim" },
]

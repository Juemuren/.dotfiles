glob_matcher: doublestar

pre-commit:
  parallel: true
  fail_on_changes: always
  jobs:
    - name: secret-scan
      run: gitleaks git --pre-commit --staged --redact --no-banner

    - name: docs-update
      run: just checks::docs::update

    - name: shell-lint
      glob:
        - "**/*.sh"
        - "**/*.bash"
        - "**/*.zsh"
      run: shellcheck -x -- {staged_files}

    - name: powershell-lint
      glob:
        - "**/*.ps1"
        - "**/*.psm1"
        - "**/*.psd1"
      run: "pwsh -NoProfile -CommandWithArgs '$args | & ./pwsh/scripts/Run-Lint.ps1' {staged_files}"

    - name: python-lint
      glob: "**/*.py"
      run: ruff check -- {staged_files} && ty check -- {staged_files}

    - name: dprint-check
      glob:
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.md"
        - "**/*.toml"
      run: dprint check --allow-no-files {staged_files}

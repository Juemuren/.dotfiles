[tools]
just = "latest"

[tasks.bootstrap]
run = "just bootstrap"

[bootstrap.hooks.pre-packages]
run = 'bash "{{ config_root }}/brew/automation/bootstrap.sh" "{{ system_brew_prefix }}"'
run_windows = 'powershell -NoProfile -File "{{ config_root }}/scoop/automation/bootstrap/install.ps1"'

[bootstrap.packages]
"winget:Microsoft.PowerShell" = { os = "windows" }
"winget:Microsoft.VisualStudioCode" = { os = "windows" }

[settings.dotfiles]
root = "~/.dotfiles"
default_mode = "symlink"
windows_symlinks = true

[dotfiles."~/.config/mise/miserc.toml"]
source = ".miserc.toml"
mode = "symlink"

[dotfile_groups.agents]
root = "agents"
target = "~/.config/mise/conf.d/agents"
mode = "symlink"

[dotfile_groups.atuin]
root = "atuin"
target = "~/.config/mise/conf.d/atuin"

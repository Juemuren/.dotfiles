"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](os)\
$os\
$username\
$shell\
[](fg:os bg:dir)\
$directory\
[](fg:dir bg:git)\
$git_branch\
$git_status\
[](fg:git bg:tech)\
$c\
$cpp\
$dotnet\
$rust\
$golang\
$vlang\
$zig\
$swift\
$java\
$kotlin\
$haskell\
$erlang\
$elixir\
$lua\
$ruby\
$julia\
$rlang\
$nodejs\
$python\
[](fg:tech bg:env)\
$container\
$docker_context\
$conda\
$pixi\
$mise\
${env_var.MSYSTEM}\
${env_var.VisualStudioVersion}\
[](fg:env bg:cmd)\
$cmd_duration\
$status\
[](fg:cmd bg:time)\
$time\
[](time)\
$line_break\
$shlvl\
$character\
"""

palette = 'blueblack'

[os]
disabled = false
style = "bg:os fg:text"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
Arch = "󰣇"
Macos = ""
Android = ""

[username]
disabled = false
show_always = true
style_user = "bg:os fg:text"
style_root = "bg:os fg:text"
format = '[ $user ]($style)'

[shell]
disabled = false
bash_indicator = ""
powershell_indicator = ""
zsh_indicator = "󰬇"
fish_indicator = ""
nu_indicator = "󰫻"
style = "bg:os fg:text"
format = '[ $indicator ]($style)'

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bg:dir fg:text"
format = "[ $path ]($style)"

[git_branch]
symbol = ""
style = "bg:git fg:text"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:git fg:text"
format = '[($all_status$ahead_behind )]($style)'

[c]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version-$name )]($style)'

[cpp]
disabled = false
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version-$name )]($style)'

[dotnet]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )]($style)'

[rust]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )]($style)'

[golang]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )]($style)'

[vlang]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )]($style)'

[zig]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )]($style)'

[swift]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )]($style)'

[java]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )]($style)'

[kotlin]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )]($style)'

[haskell]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )]($style)'

[erlang]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )]($style)'

[elixir]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )]($style)'

[lua]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )]($style)'

[ruby]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )]($style)'

[julia]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )]($style)'

[rlang]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )]($style)'

[nodejs]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )]($style)'

[python]
symbol = ""
style = "bg:tech fg:text"
format = '[ $symbol ($version )(\(#$virtualenv\) )]($style)'

[container]
symbol = ""
style = "bg:env fg:text"
format = '[ $symbol ($name )]($style)'

[docker_context]
symbol = ""
style = "bg:env fg:text"
format = '[ $symbol ($context )]($style)'

[conda]
ignore_base = false
symbol = ""
style = "bg:env fg:text"
format = '[ $symbol ($environment )]($style)'

[pixi]
symbol = ""
style = "bg:env fg:text"
format = '[ $symbol ($environment )]($style)'

[mise]
disabled = true
symbol = ""
style = "bg:env fg:text"
format = "[ $symbol $health ]($style)"

[env_var.MSYSTEM]
disabled = false
description = "The current MSYS environment"
symbol = "󰫺"
style = "bg:env fg:text"
format = '[ $symbol ($env_value )]($style)'

[env_var.VisualStudioVersion]
disabled = false
description = "The current VS version"
symbol = ""
style = "bg:env fg:text"
format = '[ $symbol ($env_value )]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:time fg:text"
format = '[  $time ]($style)'

[cmd_duration]
disabled = false
show_milliseconds = true
min_time = 100
style = "bg:cmd fg:text"
format = '[ 󰔟 $duration ]($style)'

[status]
disabled = false
map_symbol = true
pipestatus = true
symbol = ""
success_symbol = ""
not_executable_symbol = ""
not_found_symbol = ""
sigint_symbol = ""
signal_symbol = "󰉁"
success_style = "bg:cmd fg:green"
failure_style = "bg:cmd fg:red"
format = '[ $symbol $status ]($style)'
pipestatus_separator = '[|](bg:cmd fg:text)'
pipestatus_segment_format = '[$status]($style)'
pipestatus_format = '[\[$pipestatus\] => ](bg:cmd fg:text)[$symbol $status ]($style)'

[line_break]
disabled = false

[shlvl]
disabled = true
threshold = 0
symbol = ""
style = "bold fg:yellow"
format = "[$symbol]($style)"
repeat = true
repeat_offset = 1

[character]
disabled = false
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'

[palettes.catppuccin]
os   = "#f38ba8"
dir  = "#fab387"
git  = "#f9e2af"
tech = "#a6e3a1"
env  = "#89dceb"
cmd  = "#89b4fa"
time = "#b4befe"
text = "#11111b"

[palettes.tokyonight]
os   = "#f7768e"
dir  = "#ff9e64"
git  = "#e0af68"
tech = "#73daca"
env  = "#7dcfff"
cmd  = "#7aa2f7"
time = "#bb9af7"
text = "#414868"

[palettes.blueblack]
os   = "#5e7ab5"
dir  = "#5568a3"
git  = "#4e6082"
tech = "#495270"
env  = "#394260"
cmd  = "#212736"
time = "#1d2230"
text = "#e6edff"

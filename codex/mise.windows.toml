[dotfiles]
"~/.codex/rules" = { source = "rules", mode = "symlink" }
"~/.codex/pets" = { source = "pets", mode = "symlink" }
"~/.codex/config.toml" = { source = "windows/config.toml", mode = "template" }
"~/.codex/AGENTS.md" = { source = "windows/AGENTS.md", mode = "symlink" }

[dotfile_groups.codex-scripts]
root = "codex/scripts"
target = "~/.local/bin"
mode = "symlink-each"

[dotfiles]
"~/.codex/rules/*" = { source = "rules/*", mode = "symlink" }
"~/.codex/pets/*" = { source = "pets/*", mode = "symlink" }

[dotfiles.codex-scripts]
source = "scripts/*"
mode = "symlink"
variants = [
  { default = true, target = "~/.local/bin/*" },
]

[dotfiles.codex-config]
source = "windows/config.toml"
mode = "template"
variants = [
  { os = "windows", target = "~/.codex/config.toml" },
]

[dotfiles.codex-agents]
source = "windows/AGENTS.md"
mode = "symlink"
variants = [
  { os = "windows", target = "~/.codex/AGENTS.md" },
]

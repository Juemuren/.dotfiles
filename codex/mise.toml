[dotfiles.codex-pets]
source = "pets/*"
mode = "symlink"
variants = [
  { default = true, target = "~/.codex/pets/*" },
]

[dotfiles.codex-rules]
source = "rules"
mode = "symlink-each"
variants = [
  { default = true, target = "~/.codex/rules" },
]

[dotfiles.codex-scripts]
source = "scripts"
mode = "symlink-each"
variants = [
  { default = true, target = "~/.local/bin" },
]

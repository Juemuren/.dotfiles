model = "gpt-6-astra"
model_reasoning_effort = "medium"

default_permissions = "dev"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
allow_login_shell = false

[features]
network_proxy = true
mentions_v2 = false

[windows]
sandbox = "elevated"

[permissions.dev]
extends = ":workspace"

[permissions.dev.filesystem]
"~/.config/**" = "read"
"~/.cache" = "write"
"~/AppData/Local/uv/cache" = "write"
"~/AppData/Local/npm-cache" = "write"
"{{pnpm_store}}" = "write"
"~/AppData/Local/pnpm-cache" = "write"

[permissions.dev.network]
enabled = true

[permissions.dev.network.domains]
"*" = "allow"

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = false

[tui]
show_tooltips = false
session_picker_view = "comfortable"
theme = "catppuccin-mocha"
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-remaining"]
status_line_use_colors = true
terminal_title = ["activity", "project-name", "run-state", "task-progress"]
pet = "disabled"

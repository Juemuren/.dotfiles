[core]
	editor = code --wait
	pager = delta
	quotepath = false
[user]
	name = {{ vars.git_name }}
	email = {{ vars.git_email }}
[http]
	sslVerify = true
	sslCAInfo = ~/.certs/git-ca-bundle.crt
[init]
	defaultBranch = main
[delta]
	navigate = true
	side-by-side = true
[diff]
	tool = vscode
[difftool "vscode"]
	cmd = code --wait --diff \"$LOCAL\" \"$REMOTE\"
[difftool]
	prompt = false
[fetch]
	prune = true

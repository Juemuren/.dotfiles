[core]
	editor = code --wait
	pager = delta
	quotepath = false
	excludesFile = 
[user]
	name = {{git_name}}
	email = {{git_email}}
{{#if dotter.windows}}
[http]
	sslVerify = true
	sslBackend = schannel
[credential]
	helper = manager
[credential "helperselector"]
	selected = manager
{{/if}}
{{#if dotter.unix}}
[http]
	sslVerify = true
	sslCAInfo = ~/.certs/git-ca-bundle.crt
{{/if}}
[init]
	defaultBranch = main
[delta]
	navigate = true
	side-by-side = true
[diff]
	tool = vscode
[difftool "vscode"]
	cmd = code --wait --diff \"$LOCAL\" \"$REMOTE\"
[difftool]
	prompt = false

[core]
	editor = code --wait
	pager = delta
	quotepath = false
	excludesFile = 
[user]
	name = {{ vars.git_name }}
	email = {{ vars.git_email }}
[http]
	sslVerify = true
	sslBackend = schannel
[credential]
	helper = manager
[credential "helperselector"]
	selected = manager
[init]
	defaultBranch = main
[delta]
	navigate = true
	side-by-side = true
[diff]
	tool = vscode
[difftool "vscode"]
	cmd = code --wait --diff \"$LOCAL\" \"$REMOTE\"
[difftool]
	prompt = false
[fetch]
	prune = true
[safe]
	directory = *

[extend]
useDefault = true

[[rules]]
id = "pi-models-literal-api-key"
description = "pi/models.json 的 apiKey 必须是 !command、$ENV 或 {{ vars.x }}，不能写字面量"
path = '''(^|[\\/])pi[\\/]models\.json$'''
regex = '''"apiKey"\s*:\s*"[^!${]'''

[[allowlists]]
description = "Windows Terminal 的快捷键绑定，形如 \"keys\": \"ctrl+shift+down\"，不是凭据"
regexTarget = "line"
regexes = ['''"keys"\s*:\s*"(ctrl|alt|shift)\+''']

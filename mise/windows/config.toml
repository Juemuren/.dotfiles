[tools]
aube = "latest"
biome = "latest"
cspell = "latest"
deno = "latest"
dprint = "latest"
gitleaks = "latest"
go = "latest"
jq = "latest"
just = "latest"
lefthook = "latest"
node = "lts"
"npm:@wechatsync/cli" = "latest"
"pipx:fonttools" = "latest"
"pipx:ocrmypdf" = "latest"
playwright = "latest"
pnpm = "latest"
prek = "latest"
ruff = "latest"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
ty = "latest"
typos = "latest"
uv = "latest"

[tools.python]
version = "latest"
postinstall = 'python -m pip install -r "{{config_root}}/.config/mise/python.txt"'

[settings]
idiomatic_version_file_enable_tools = ["python", "node", "pnpm", "go"]
auto_install = false
not_found_auto_install = false

[settings.python]
uv_venv_auto = "source"

[settings.pipx]
uvx = true

[settings.npm]
package_manager = "aube"

[env]
VISUAL = { default = "code --wait" }
EDITOR = { default = "code --wait" }
LANG = { default = "zh_CN.UTF-8" }

LESS = { default = "-RXFX" }

GOTOOLCHAIN = "local"
PNPM_CONFIG_PM_ON_FAIL = "ignore"
NODE_USE_SYSTEM_CA = 1

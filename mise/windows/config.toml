[tools]
biome = "latest"
cspell = "latest"
deno = "latest"
dprint = "latest"
"github:agda/agda" = { version = "latest", asset_pattern = "Agda-v*-win64.zip" }
gitleaks = "latest"
go = "latest"
jq = "latest"
just = "latest"
lefthook = "latest"
node = "lts"
"npm:@mermaid-js/mermaid-cli" = { version = "latest", install_env = { PUPPETEER_SKIP_DOWNLOAD = "true" } }
"npm:@wechatsync/cli" = "latest"
"pypi:fonttools" = "latest"
"pypi:mineru" = { version = "latest", python = "3.14", extras = "all" }
"pypi:ocrmypdf" = "latest"
playwright = "latest"
pnpm = "latest"
prek = "latest"
ruff = "latest"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
ty = "latest"
typos = "latest"
uv = "latest"
prettier = "latest"

[tools.python]
version = "latest"
postinstall = 'python -m pip install -r "{{config_root}}/.config/mise/conf.d/mise/windows/python.txt"'

[settings]
idiomatic_version_file_enable_tools = ["python", "node", "pnpm", "go"]
auto_install = false
not_found_auto_install = false

[settings.python]
uv_venv_auto = "source"

[settings.pipx]
uvx = true

[settings.npm]
package_manager = "pnpm"

[env]
VISUAL = { default = "code --wait" }
EDITOR = { default = "code --wait" }
LANG = { default = "zh_CN.UTF-8" }

LESS = { default = "-FRX" }
PUPPETEER_EXECUTABLE_PATH = { default = "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" }

GOTOOLCHAIN = "local"
PNPM_CONFIG_PM_ON_FAIL = "ignore"
NODE_USE_SYSTEM_CA = 1

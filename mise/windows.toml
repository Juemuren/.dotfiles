[tools]
aube = "latest"
go = "latest"
node = "lts"
"npm:cspell" = "latest"
"pipx:fonttools" = "latest"
pnpm = "latest"
python = "latest"
uv = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python", "node"]

[settings.python]
uv_venv_auto = "source"

[settings.pipx]
uvx = true

[settings.npm]
package_manager = "aube"
